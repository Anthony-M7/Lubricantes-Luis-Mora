{% extends 'paneles/admin.html' %}
{% load static %}

{% block dashboard %}
<script src="{% static 'js/jquery.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'vendor/select2/css/select2.min.css' %}">

<div class="flex flex-col md:flex-row md:items-center justify-between pb-4 border-b border-slate-200 mb-6 gap-4">
  {% block venta_header %}
  <div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-brand-dark tracking-tight">{% block venta_title %}Ventas{% endblock %}</h1>
  </div>
  {% endblock %}
  <div class="flex items-center space-x-3">
    {% block venta_buttons %}{% endblock %}
  </div>
</div>

{% block venta_content %}{% endblock %}

<script src="{% static 'vendor/select2/js/select2.min.js' %}"></script>
<script src="{% static 'js/ventas/ventas.js' %}"></script>
{% endblock %}
